# ===================================================================
# College Administration System - Configuration
# ===================================================================
spring.application.name=college-administration-system
server.port=8080

# Spring Boot Datasource (Embedded H2 SQL Database with MySQL syntax compatibility)
spring.datasource.url=jdbc:h2:./data/collegedb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Web Console (accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA / Hibernate settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
